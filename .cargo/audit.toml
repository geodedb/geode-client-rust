# cargo-audit configuration
# See: https://rustsec.org/
#
# This file documents known security advisories that have been reviewed and
# determined to be acceptable risks for this project.

[advisories]
# Advisories to ignore (with documented justification)
ignore = [
    # RUSTSEC-2025-0111: tokio-tar PAX header parsing vulnerability
    # Status: ACCEPTED RISK (Dev-only dependency)
    # Justification: This advisory affects tokio-tar which is only used as a
    # transitive dependency of testcontainers (dev-dependency). It is never
    # included in production builds. The vulnerability relates to PAX header
    # parsing which could allow file smuggling, but since we only use this
    # for pulling Docker images in integration tests, the attack surface is
    # limited to our controlled test environment.
    # No upstream fix is available as of 2026-02-05.
    # Review date: 2026-02-05
    "RUSTSEC-2025-0111",

    # RUSTSEC-2025-0134: rustls-pemfile unmaintained
    # Status: ACCEPTED RISK (Warning only, no known exploits)
    # Justification: This is an unmaintained package warning, not a security
    # vulnerability. The package is widely used and has no known security
    # issues. It's a transitive dependency of tonic and bollard. We will
    # monitor for a maintained replacement or fork. The TLS stack itself
    # (rustls) remains actively maintained and secure.
    # Review date: 2026-02-05
    "RUSTSEC-2025-0134",

    # RUSTSEC-2026-0009: time 0.3.45 stack exhaustion DoS
    # Status: ACCEPTED RISK (Dev-only transitive dependency)
    # Justification: This advisory affects time >=0.3.35, <0.3.47 which is a
    # transitive dependency via testcontainers → serde_with → time. It is only
    # present in dev-dependencies and never included in production builds.
    # The vulnerability is a stack exhaustion DoS via crafted input, which has
    # no impact in our controlled test environment.
    # Review date: 2026-02-06
    "RUSTSEC-2026-0009",

    # RUSTSEC-2026-0097: rand unsound with a custom logger using `rand::rng()`
    # Status: ACCEPTED RISK (Warning only; not applicable to our usage)
    # Justification: This is an "unsound" warning, not a vulnerability. It
    # affects rand 0.8.5, pulled in transitively via tonic 0.12 -> tower 0.4
    # (load-balancing jitter) and rust_decimal. The unsoundness only manifests
    # under a specific misuse — configuring a custom logger that calls
    # `rand::rng()` — which this client never does (rand is purely a
    # non-cryptographic transitive dependency, never used directly). No patched
    # rand 0.8.x exists; the proper fix requires a major bump of tonic/tower,
    # out of scope for this parity release. Revisit when tonic ships a release
    # that uses rand 0.9.
    # Review date: 2026-06-01
    "RUSTSEC-2026-0097",
]
