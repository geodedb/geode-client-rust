# =============================================================================
# Geode Rust Client CI/CD Pipeline
# Uses DevNW CI/CD Catalog components
# =============================================================================

include:
  # Lint: rustfmt and clippy checks
  # Pinned to v1.9.15 for supply chain security (CWE-1104)
  - component: gitlab.com/devnw/ci-catalog/rust-lint@v1.9.15
    inputs:
      stage: lint

  # Build: compile in release mode
  - component: gitlab.com/devnw/ci-catalog/rust-build@v1.9.15
    inputs:
      stage: build
      profile: release

  # Unit tests
  - component: gitlab.com/devnw/ci-catalog/rust-test@v1.9.15
    inputs:
      stage: test
      test_args: '--lib --no-fail-fast'

  # Property-based tests (proptest)
  - component: gitlab.com/devnw/ci-catalog/rust-test@v1.9.15
    inputs:
      stage: test
      test_args: '--test proptest --no-fail-fast'

  # Doc tests
  - component: gitlab.com/devnw/ci-catalog/rust-test@v1.9.15
    inputs:
      stage: test
      test_args: '--doc'

  # Coverage reporting
  - component: gitlab.com/devnw/ci-catalog/rust-coverage@v1.9.15
    inputs:
      stage: coverage
      tarpaulin_args: '--lib'
      allow_failure: true

  # Documentation generation
  - component: gitlab.com/devnw/ci-catalog/rust-doc@v1.9.15
    inputs:
      stage: docs
      publish_pages: true

  # Security scanning - pinned versions for supply chain security
  - component: gitlab.com/devnw/ci-catalog/security-sast@v1.9.15
    inputs:
      stage: security

  - component: gitlab.com/devnw/ci-catalog/security-dependency-scanning@v1.9.15
    inputs:
      stage: security

  - component: gitlab.com/devnw/ci-catalog/security-secrets@v1.9.15
    inputs:
      stage: security

  - component: gitlab.com/devnw/ci-catalog/security-gitleaks@v1.9.15

  # SBOM generation and scanning
  - component: gitlab.com/devnw/ci-catalog/sbom-generate@v1.9.15

  - component: gitlab.com/devnw/ci-catalog/sbom-scan@v1.9.15

  # Release creation
  - component: gitlab.com/devnw/ci-catalog/release-semantic@v1.9.15
    inputs:
      stage: release

  # Publish to crates.io (triggered on version tags)
  # Uses CARGO_REGISTRY_TOKEN CI/CD variable
  - component: gitlab.com/devnw/ci-catalog/rust-publish@v1.9.15
    inputs:
      stage: publish
      needs: rust-build

# SBOM jobs may fail due to DNS/network issues downloading syft
sbom-generate:
  allow_failure: true

sbom-scan:
  allow_failure: true

default:
  tags:
    - company
    - linux

stages:
  - lint
  - build
  - test
  - coverage
  - docs
  - security
  - sbom
  - release
  - publish

# -----------------------------------------------------------------------------
# Rust Dependency Vulnerability Scanning (cargo-audit)
# Scans Cargo.lock for known vulnerabilities in RustSec Advisory Database
# -----------------------------------------------------------------------------

security:cargo-audit:
  stage: security
  image: rust:1.85-bookworm
  before_script:
    - cargo install cargo-audit --locked
  script:
    - cargo audit --deny warnings
  cache:
    key: cargo-audit-${CI_COMMIT_REF_SLUG}
    paths:
      - $CARGO_HOME/bin/
      - $CARGO_HOME/registry/
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

# -----------------------------------------------------------------------------
# Integration Tests (requires Geode server)
# NOTE: This job requires the Geode Docker image to be available.
# -----------------------------------------------------------------------------

test:integration:
  stage: test
  image: rust:latest
  services:
    - name: geodedb/geode:latest
      alias: geode
      command: ["serve", "--listen", "0.0.0.0:3141", "--log-level", "info"]
  variables:
    GEODE_HOST: geode
    GEODE_PORT: "3141"
  script:
    - cargo test --features integration --no-fail-fast -- --test-threads=1
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  allow_failure: true  # Fails until Geode Docker image is published

# -----------------------------------------------------------------------------
# Benchmark Job (compile only in CI)
# -----------------------------------------------------------------------------

benchmark:
  stage: test
  image: rust:latest
  cache:
    key: "rust-latest-${CI_COMMIT_REF_SLUG}"
    paths:
      - .cargo/registry/
      - .cargo/git/
      - target/
    policy: pull
  script:
    - cargo bench --no-run
  artifacts:
    paths:
      - target/criterion/
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  allow_failure: true

# -----------------------------------------------------------------------------
# GitLab Pages (documentation hosting)
# -----------------------------------------------------------------------------

pages:
  stage: docs
  image: rust:latest
  script:
    - cargo doc --no-deps
    - mv target/doc public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
