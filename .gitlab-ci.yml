# =============================================================================
# Geode Rust Client CI/CD Pipeline
# =============================================================================

stages:
  - lint
  - build
  - test

variables:
  CARGO_HOME: $CI_PROJECT_DIR/.cargo
  RUSTFLAGS: "-D warnings"

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .cargo/
    - target/

lint:
  stage: lint
  image: registry.gitlab.com/devnw/ci-catalog/rust:stable
  script:
    - cargo fmt --check
    - cargo clippy -- -D warnings
  rules:
    - if: '$CI_COMMIT_BRANCH || $CI_COMMIT_TAG'
  allow_failure: true

build:
  stage: build
  image: registry.gitlab.com/devnw/ci-catalog/rust:stable
  script:
    - cargo build --release
  artifacts:
    paths:
      - target/release/
    expire_in: 1 week
  rules:
    - if: '$CI_COMMIT_BRANCH || $CI_COMMIT_TAG'

test:
  stage: test
  image: registry.gitlab.com/devnw/ci-catalog/rust:stable
  script:
    - cargo test --release
  rules:
    - if: '$CI_COMMIT_BRANCH || $CI_COMMIT_TAG'
  allow_failure: true  # Tests may require running Geode server
