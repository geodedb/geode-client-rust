# =============================================================================
# Geode Rust Client CI/CD Pipeline
# Uses DevNW CI/CD Catalog components
# =============================================================================

include:
  # Lint: rustfmt and clippy checks
  # Pinned to v1.9.15 for supply chain security (CWE-1104)
  - component: gitlab.com/devnw/ci-catalog/rust-lint@aad997d40e358eeef7ec943f761498341c37c724
    inputs:
      stage: lint

  # Build: compile in release mode
  - component: gitlab.com/devnw/ci-catalog/rust-build@aad997d40e358eeef7ec943f761498341c37c724
    inputs:
      stage: build
      profile: release

  # One job runs unit, property, and documentation tests. Repeating this
  # component overwrites its fixed rust-test job name instead of adding jobs.
  # Cargo.toml keeps the server integration target behind its feature flag.
  - component: gitlab.com/devnw/ci-catalog/rust-test@aad997d40e358eeef7ec943f761498341c37c724
    inputs:
      stage: test
      test_args: '--no-fail-fast'

  # Coverage reporting
  - component: gitlab.com/devnw/ci-catalog/rust-coverage@aad997d40e358eeef7ec943f761498341c37c724
    inputs:
      stage: coverage
      tarpaulin_args: '--lib'
      allow_failure: true

  # Documentation generation
  - component: gitlab.com/devnw/ci-catalog/rust-doc@aad997d40e358eeef7ec943f761498341c37c724
    inputs:
      stage: docs
      publish_pages: true

  # Security scanning - pinned versions for supply chain security
  - component: gitlab.com/devnw/ci-catalog/security-gitleaks@aad997d40e358eeef7ec943f761498341c37c724

  # SBOM generation and scanning
  - component: gitlab.com/devnw/ci-catalog/sbom-generate@aad997d40e358eeef7ec943f761498341c37c724

  - component: gitlab.com/devnw/ci-catalog/sbom-scan@aad997d40e358eeef7ec943f761498341c37c724

  # Release creation
  - component: gitlab.com/devnw/ci-catalog/release-semantic@aad997d40e358eeef7ec943f761498341c37c724
    inputs:
      release_auth: job_token
      stage: release

  # Publish to crates.io (triggered on version tags)
  # Uses CARGO_REGISTRY_TOKEN CI/CD variable
  - component: gitlab.com/devnw/ci-catalog/rust-publish@aad997d40e358eeef7ec943f761498341c37c724
    inputs:
      stage: publish
      needs: rust-build

# SBOM jobs may fail due to DNS/network issues downloading syft
sbom-generate:
  interruptible: true
  allow_failure: true

sbom-scan:
  interruptible: true
  allow_failure: true

variables:
  CARGO_HOME: "$CI_PROJECT_DIR/.cargo"

.rust-cache:
  cache: &rust-cache
    key:
      prefix: rust-latest
      files: [Cargo.lock]
    paths:
      - .cargo/registry/
      - .cargo/git/
      - target/
    policy: pull

default:
  tags:
    - company
    - linux

stages:
  - lint
  - build
  - test
  - coverage
  - docs
  - security
  - sbom
  - release
  - publish

# -----------------------------------------------------------------------------
# Rust Dependency Vulnerability Scanning (cargo-audit)
# Scans Cargo.lock for known vulnerabilities in RustSec Advisory Database
# -----------------------------------------------------------------------------

security:cargo-audit:
  interruptible: true
  stage: security
  image: rust:1.100-bookworm
  tags: [company, linux, x86]
  variables:
    CARGO_HOME: "$CI_PROJECT_DIR/.cargo-audit"
  before_script:
    # Verify the pinned upstream binary instead of compiling its dependency
    # graph on every cold runner. Cache paths must be inside the project.
    - |
      AUDIT_DIR="$CI_PROJECT_DIR/.ci-tools/cargo-audit"
      AUDIT_SHA256=66f9c8f530950d106c1869ce27ef5a4008bcea53c7716c3ed8117586337ee7d8
      if ! echo "$AUDIT_SHA256  $AUDIT_DIR/cargo-audit" | sha256sum --check --status; then
        test "$(uname -m)" = x86_64
        mkdir -p "$AUDIT_DIR"
        ARCHIVE=$(mktemp)
        curl -fsSL --retry 3 https://github.com/rustsec/rustsec/releases/download/cargo-audit/v0.22.2/cargo-audit-x86_64-unknown-linux-musl-v0.22.2.tgz -o "$ARCHIVE"
        echo "7fb9497f8594b389e5fce5ef9b92db08432996895b2e0c5a0167a69ed445c428  $ARCHIVE" | sha256sum --check --strict
        tar -xzf "$ARCHIVE" -C "$AUDIT_DIR" --strip-components=1 cargo-audit-x86_64-unknown-linux-musl-v0.22.2/cargo-audit
        rm -f "$ARCHIVE"
        echo "$AUDIT_SHA256  $AUDIT_DIR/cargo-audit" | sha256sum --check --strict
      fi
      export PATH="$AUDIT_DIR:$PATH"
  script:
    - cargo audit --deny warnings
  cache:
    key: cargo-audit-v2-0.22.2-linux-x86_64
    paths:
      - .ci-tools/cargo-audit/
      - .cargo-audit/advisory-db/
      - .cargo-audit/registry/
    policy: pull-push
    when: always
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

# -----------------------------------------------------------------------------
# Integration Tests (requires Geode server)
# NOTE: This job requires the Geode Docker image to be available.
# -----------------------------------------------------------------------------

test:integration:
  interruptible: true
  stage: test
  image: rust:latest
  cache: *rust-cache
  services:
    - name: geodedb/geode:0.8.27@sha256:2c5a9b856ab7ba4b12e6bc88786a663c3321270eec308bde5f8f9028fa69bb85
      alias: geode
      command: ["serve", "--listen", "0.0.0.0:3141", "--log-level", "info", "--data-dir", "/data"]
  variables:
    GEODE_HOST: geode
    GEODE_PORT: "3141"
    # Disposable CI service: bootstrap the same account the clients use.
    GEODE_ADMIN_USERNAME: "geode"
    GEODE_USERNAME: "geode"
    GEODE_PASSWORD: "Correct horse battery staple" # gitleaks:allow
    GEODE_ADMIN_PASSWORD: "$GEODE_PASSWORD"
    GEODE_DEFAULT_PASSWORD: "$GEODE_PASSWORD"
    GEODE_METRICS_PORT: "9090"
    GEODE_METRICS_BIND: "0.0.0.0"
    HEALTHCHECK_TCP_PORT: "9090"
  script:
    - cargo test --features integration --test integration --no-fail-fast -- --test-threads=1
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  allow_failure: true  # Fails until Geode Docker image is published

# -----------------------------------------------------------------------------
# Benchmark Job (compile only in CI)
# -----------------------------------------------------------------------------

benchmark:
  interruptible: true
  stage: test
  image: rust:latest
  cache: *rust-cache
  script:
    - cargo bench --no-run
  artifacts:
    paths:
      - target/criterion/
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  allow_failure: true

# -----------------------------------------------------------------------------
# GitLab Pages (documentation hosting)
# -----------------------------------------------------------------------------

pages:
  interruptible: false
  stage: docs
  image: rust:latest
  needs:
    - job: rust-doc
      artifacts: true
  script:
    - test -f public/geode_client/index.html
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

workflow:
  # SRE-172: a newer commit on the same ref cancels the superseded pipeline's
  # interruptible (validation) jobs. Release/deploy jobs stay non-interruptible.
  auto_cancel:
    on_job_failure: all
    on_new_commit: interruptible
  # An open MR owns push validation; keep schedules, API, trigger,
  # parent pipelines, tags and manual runs admitted as before.
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - when: always
